[project]
name = "portfolio"
version = "2.5.0"
description = "Dependency tree for Iliyan's portfolio web app"

dependencies = [
    "Django>=6.1",
    "mockito>=2.0.4",
    "setuptools>=84.0.0",
    "email-validator>=2.3.0",
    "pyyaml>=6.0.3",
    "django>=6.0.6",
    "pillow>=12.3.0",
    "django-libsass>=0.9",
    "django-compressor>=4.6.0",
    "markdown>=3.10.3",
    "uvicorn>=0.52.1",
    "uvicorn-worker>=0.4.0",
    "gunicorn>=26.0.0",
    "typing-extensions>=4.16.0",
    "whitenoise>=6.12.0",
    "pip>=26.2.1",
    "django-csp>=4.0",
    "loguru>=0.7.3",
    "loki-logger-handler>=1.1.2",
    "requests>=2.34.2",
    "psycopg2-binary>=2.9.12",
    "boto3>=1.43.66",
    "django-storages>=1.14.6",
    "django-configurations>=2.5.1",
]
requires-python = "==3.14.*"
readme = "README.md"
license = {text = "GPL"}

[dependency-groups]
dev = [
    "python-dotenv>=1.2.2",
]
test = [
    "black>=26.5.1",
    "django-migration-linter>=6.0.0",
    "django-test-migrations>=1.6.0",
    "flake8>=7.3.0",
    "moto>=5.2.2",
    "pylint>=4.0.7",
    # NOTE: Broken for 3.14
    # "pyre-check>=0.9.25",
    # BUG: Version 0.5.9 is vulnarable
    # "fb-sapp>=0.5.9",
    "setuptools-rust>=1.13.0",
]
