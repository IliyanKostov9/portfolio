name: Terraform workflow

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.TF_ARMADEUS_AWS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_ARMADEUS_AWS_SECRET_ACCESS_KEY }}

on:
  push:
    branches:
      - master
    paths:
      - infra/iac/**
  workflow_dispatch:

jobs:
  build:
    name: Terraform build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Age
        uses: AnimMouse/setup-age@d7fa8779bcb38294334a3aa753c7171e8da5067e # v1.2

      - name: Decrypt terraform.tfvars
        run: |
          echo "$AGE_KEY" > /tmp/age-key.txt
          age --decrypt -i /tmp/age-key.txt terraform.tfvars.age > terraform.tfvars
          rm /tmp/age-key.txt
        working-directory: infra/iac/env/prod
        env:
          AGE_KEY: ${{ secrets.PORTFOLIO_AGE_KEY }}

      - name: Setup terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e #v4
        with:
          terraform_version: "1.9"

      - name: Initialize
        run: make tf-init

      - name: Validate
        if: success() || failure()
        run: make tf-validate

      - name: Plan
        run: make tf-plan

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: |
            infra/
            Makefile
            .terraformignore
          retention-days: 1

  deploy:
    name: Terraform deploy
    runs-on: ubuntu-latest
    needs: build
    environment: prod
    steps:
      - name: Download
        uses: actions/download-artifact@v4
        with:
          name: build
          path: .

      - name: Setup terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e #v4
        with:
          terraform_version: "1.9"

      - name: Initialize
        run: make tf-init

      - name: Apply
        run: make tf-apply
