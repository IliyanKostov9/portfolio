name: Terraform workflow

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.TF_ARMADEUS_AWS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_ARMADEUS_AWS_SECRET_ACCESS_KEY }}

on:
  push:
    branches:
      - master
    paths:
      - infra/iac/**
  workflow_dispatch:

jobs:
  build:
    name: Terraform build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            infra
            flake.nix
            flake.lock
            Makefile
          sparse-checkout-cone-mode: false

      - name: Setup Age
        uses: AnimMouse/setup-age@d7fa8779bcb38294334a3aa753c7171e8da5067e # v1.2

      - name: Decrypt terraform.tfvars
        run: |
          echo "$AGE_KEY" > /tmp/age-key.txt
          make decrypt-file FILE=infra/iac/env/prod/terraform.tfvars.age AGE_KEY=/tmp/age-key.txt
          rm /tmp/age-key.txt
        env:
          AGE_KEY: ${{ secrets.PORTFOLIO_AGE_KEY }}

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71
        with:
          name: iliyankostov9-portfolio-infra
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
          extraPullNames: devenv
      - name: Install devenv.sh
        run: nix profile add nixpkgs#devenv

      - name: Initialize
        shell: bash -c "nix develop --impure .#infra -c bash -- {0}"
        run: make tf-init

      - name: Validate
        if: success() || failure()
        shell: bash -c "nix develop --impure .#infra -c bash -- {0}"
        run: make tf-validate

      - name: Plan
        shell: bash -c "nix develop --impure .#infra -c bash -- {0}"
        run: make tf-plan

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: build
          path: |
            infra/
            Makefile
            .terraformignore
            flake.nix
            flake.lock
          retention-days: 1

  deploy:
    name: Terraform deploy
    runs-on: ubuntu-latest
    needs: build
    environment: prod
    steps:
      - name: Download
        uses: actions/download-artifact@v8
        with:
          name: build
          path: .

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71
        with:
          name: iliyankostov9-portfolio-infra
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
          extraPullNames: devenv
      - name: Install devenv.sh
        run: nix profile add nixpkgs#devenv

      - name: Initialize
        shell: bash -c "nix develop --impure .#infra -c bash -- {0}"
        run: make tf-init

      - name: Apply
        shell: bash -c "nix develop --impure .#infra -c bash -- {0}"
        run: make tf-apply
