    Екипът, в който работех, е част от отдела за резервация на билети. Заеманата от мен длъжност е „платформен инженер“ (platform engineer), а основната ми задача е поддръжката,
    експлоатацията и развитието на конвейера за обработка на данни (data processing pipeline). Той отговаря
