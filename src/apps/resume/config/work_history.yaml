  en_description: |
    My first project is a software company, that provides global distribution service to airline companies. These distributions of data products are in the area of the travel industry.

    The team I was in is in the department of ticket reservation. The role I'm currently working is platform engineer and the objective is to maintain,
    operate and develop the data processing pipeline, that is responsible
    for ingesting the raw data, sent by the global distribution system,
    process it through multiple layers and finally send it to the customer via various transfer protocols - FTP or S3.

    What I've achieved during my experience there, includes:
      - migrated legacy Groovy scripts to an internal framework, called workflow, that handled the entire lifecycle of building, testing and publishing an app
      - rewrote from a single Bash file feed delivery framework to a clean & modular Python set of scripts, that greately improved  the reliability and maintainability of the system
      - refactored a Python script, that's responsible for compressing and sending customer data from raw to source S3 bucket, therefore opening the possibility to extend it's capabilities due to management's needs, as well as providing the ability to have better testing before making a new release
      - greatily improved the internal documentation by modernizing it depending on our current needs of knowledge and removed outdated document pages
      - led the migration of our internal repositories and dev's ones from Bitbucket to Github
      - designed a high level design of how to do releases 'properly', therefore improving the process of rollback and gaining the confidence from CAB
  bg_description: |
